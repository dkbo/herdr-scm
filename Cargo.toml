[package]
name = "herdr-scm"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A read-only, multi-repo source-control overview panel that runs as a herdr TUI pane"
license = "MIT"

[lib]
name = "herdr_scm"
path = "src/lib.rs"

[[bin]]
name = "herdr-scm"
path = "src/main.rs"

[dependencies]
ratatui = "0.30.1"
crossterm = "0.29.0"
ansi-to-tui = "8.0.1"
ignore = "0.4.26"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
tempfile = "3.23"
